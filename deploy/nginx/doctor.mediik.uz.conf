# Doctor deep-link domain — doctor.mediik.uz
# (app.mediik.uz bilan parallel — bir xil mantiq, faqat doctor app uchun)

server {
    listen 80;
    server_name doctor.mediik.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name doctor.mediik.uz;

    ssl_certificate     /etc/letsencrypt/live/doctor.mediik.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doctor.mediik.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /.well-known/apple-app-site-association {
        alias /var/www/well-known/doctor.mediik.uz/apple-app-site-association;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /.well-known/assetlinks.json {
        alias /var/www/well-known/doctor.mediik.uz/assetlinks.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        root /var/www/mediik-doctor-landing;
        try_files $uri /index.html;
    }
}
