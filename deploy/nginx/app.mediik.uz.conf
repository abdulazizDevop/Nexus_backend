# Patient deep-link domain — app.mediik.uz
#
# 2 ta vazifa:
#   1) Universal Links (iOS) + App Links (Android) uchun .well-known fayllarni
#      to'g'ri Content-Type bilan host qilish.
#   2) App o'rnatilmagan foydalanuvchilar uchun web fallback sahifa
#      ("Pro obunangiz aktivlashtirildi" + App Store/Play Store linklari).

server {
    listen 80;
    server_name app.mediik.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.mediik.uz;

    ssl_certificate     /etc/letsencrypt/live/app.mediik.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mediik.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # iOS Universal Links — Apple talab qiladi:
    # - Aniq URL: /.well-known/apple-app-site-association (extension yo'q)
    # - Content-Type: application/json
    # - HTTPS only, no redirect
    location = /.well-known/apple-app-site-association {
        alias /var/www/well-known/app.mediik.uz/apple-app-site-association;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Android App Links
    location = /.well-known/assetlinks.json {
        alias /var/www/well-known/app.mediik.uz/assetlinks.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Web fallback — app o'rnatilmagan bo'lsa shu sahifa ochiladi
    # /var/www/mediik-app-landing/ — alohida static landing site
    location / {
        root /var/www/mediik-app-landing;
        try_files $uri /index.html;
    }
}
